name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact replays and 19 mutants
        run: |
          set -euo pipefail
          python -B replay.py --all-mutants
          python -B replay_pressure.py --all-mutants
      - name: Prose style
        run: '! grep -n -e "—" -e "---" note/main.tex note/refs.bib README.md'
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: false
          build: false
      - name: Fetch pinned Mathlib cache and build
        working-directory: lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          for source in Core Pressure; do
            lake env lean "$source.lean" > "$source.axioms.txt"
            if grep -E 'sorryAx|sorry' "$source.axioms.txt"; then exit 1; fi
          done
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
      - name: Build manuscript and check references
        working-directory: note
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'Citation .* undefined|Reference .* undefined|undefined (references|citations)|Label\(s\) may have changed|Overfull \\hbox' main.log; then exit 1; fi
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://github.com/SuperMatics-Inc/quasi1d-phonon-pair-decay' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24369897' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24369899' urls.txt
